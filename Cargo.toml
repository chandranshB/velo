[package]
name = "velo"
version = "0.1.0"
edition = "2024"
description = "The Velo Programming Language — Pythonic syntax, static safety, zero-overhead native compilation"

[dependencies]
cranelift-codegen = "0.138.0"
cranelift-frontend = "0.138.0"
cranelift-jit = "0.138.0"
cranelift-module = "0.138.0"
cranelift-native = "0.138.0"
cranelift-object = "0.138.0"
target-lexicon = "0.13.6"

[build-dependencies]
cc = "1.11.3"

[profile.release]
opt-level = 3
lto = "thin"
